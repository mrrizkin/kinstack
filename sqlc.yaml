version: "2"

# Every SQL statement in the repository is generated: reads and writes both
# live in <slice>/queries.sql, are type-checked against db/schema.sql when they
# are generated, and their rows are mapped to domain types inside
# repository_pg.go. Error classification (23505/23503), transactions, and
# multi-statement flows stay in Go: sqlc returns the driver error untouched.
#
# Parameters are named (`sqlc.arg` for required, `sqlc.narg` for NULL-able) so
# the generated Params fields say what they bind; a bare `$n` is only used where
# a name would add nothing. The emitted statement is still positional.
#
# `just sqlc-generate` rebuilds db/schema.sql from the migrations first; sqlc
# parses that file instead of the goose migrations, which contain both
# directions in each file.
sql:
  - engine: postgresql
    schema: db/schema.sql
    queries: internal/features/apitoken/queries.sql
    gen:
      go:
        package: apitokensqlc
        out: internal/features/apitoken/sqlc
        sql_package: database/sql
        emit_prepared_queries: true
        omit_unused_structs: true
  - engine: postgresql
    schema: db/schema.sql
    queries: internal/features/audit/queries.sql
    gen:
      go:
        package: auditsqlc
