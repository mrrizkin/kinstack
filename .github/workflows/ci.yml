name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI verifies; it never writes refs. Releases are tagged by hand.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: kinstack
          POSTGRES_USER: kinstack
          POSTGRES_PASSWORD: kinstack
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kinstack -d kinstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Database-backed tests (identity bindings, batched authorization
      # queries, audit pruning) run against the migrated service above.
      DATABASE_URL: postgres://kinstack:kinstack@localhost:5433/kinstack?sslmode=disable
      KINSTACK_MIGRATION_ROLLBACK_DATABASE_URL: postgres://kinstack:kinstack@localhost:5433/kinstack_rollback?sslmode=disable
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y ripgrep postgresql-client
      # The Go build embeds assets/emails/dist, which vite build generates.
      - run: bun install --frozen-lockfile
      - run: bun x vite build
      - run: go build ./...
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - name: go format
        run: ./scripts/check-go-format.sh
      - run: go run ./cmd/migrate up
      - name: create rollback database
        run: PGPASSWORD=kinstack psql -h localhost -p 5433 -U kinstack -d postgres -c 'CREATE DATABASE kinstack_rollback'
      - run: go test -race ./...
      # Same seed corpus as `just fuzz`, on a budget: a fuzz target nobody runs
      # decays into an expensive unit test.
      - run: go test -run=NONE -fuzz=FuzzSplitToken -fuzztime=30s ./internal/features/apitoken

      - run: ./scripts/check-feature-slices.sh
      - run: ./scripts/check-determinism.sh
      - run: go mod tidy -diff
      - run: ./scripts/check-observability.sh
      - run: ./scripts/check-vuln.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned: a scanner that changes under you cannot be reasoned about.
      - name: Install gitleaks
        run: |
          version=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - run: ./scripts/check-secrets.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bun install --frozen-lockfile
      # Nothing is ignored: a dependency that cannot be patched is a deviation
      # recorded in PILLARS.md, not a flag here.
      - run: bun audit
      # vite build generates auto-imports.d.ts + components.d.ts (gitignored)
      # which vue-tsc needs before it can resolve auto-imported components.
      - run: bun x vite build
      - run: bun x vue-tsc --build
      - run: bun test resources/js
      - run: bun x oxlint resources
      - run: bun x oxfmt --check resources/
      - run: ./scripts/check-icons.sh

  smoke-csp:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: kinstack
          POSTGRES_USER: kinstack
          POSTGRES_PASSWORD: kinstack
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kinstack -d kinstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun x vite build
      - name: Migrate database
        env:
          DATABASE_URL: postgres://kinstack:kinstack@localhost:5433/kinstack?sslmode=disable
        run: go run ./cmd/migrate up
      - name: CSP smoke
        env:
          APP_ENV: development
          APP_URL: http://localhost:3120
          DATABASE_URL: postgres://kinstack:kinstack@localhost:5433/kinstack?sslmode=disable
          VALKEY_HOST: localhost
          VALKEY_PORT: 6379
          VALKEY_PASSWORD: ""
          MEDIA_ENABLED: "false"
        run: ./scripts/smoke-csp.sh
